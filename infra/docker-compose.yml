name: mockmatch

# Local data lives under ./volumes/ (bind mounts — not anonymous Docker volumes).
#   volumes/postgres  — PG data
#   volumes/redis     — Redis AOF/RDB
#   volumes/s3        — S3Proxy filesystem backend (buckets as dirs)

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: mockmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mockmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mockmatch}
      POSTGRES_DB: ${POSTGRES_DB:-mockmatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mockmatch} -d ${POSTGRES_DB:-mockmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mockmatch-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible store (AWS SDK → S3_ENDPOINT). Files under volumes/s3/<bucket>/.
  # https://github.com/gaul/s3proxy
  s3proxy:
    image: andrewgaul/s3proxy:latest
    container_name: mockmatch-s3proxy
    restart: unless-stopped
    environment:
      # AWS SDK v3 signs with SigV4 — must match (not aws-v2)
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: ${S3_ACCESS_KEY:-local}
      S3PROXY_CREDENTIAL: ${S3_SECRET_KEY:-localsecret}
      S3PROXY_ENDPOINT: http://0.0.0.0:80
      # CORS so browser presigned GETs work from the Vite app if needed
      S3PROXY_CORS_ALLOW_ALL: "true"
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    ports:
      - "${S3_PORT:-9090}:80"
    volumes:
      - ./volumes/s3:/data
    healthcheck:
      # Image is Java; no curl. TCP check via /dev/tcp if bash exists — use process check.
      test: ["CMD-SHELL", "pgrep -f s3proxy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
