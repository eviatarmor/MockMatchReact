# Untrusted-code sandbox **image** for @mockmatch/ide (gVisor when available).
#
# App model: **one Docker container per collab session** (created by the WS process).
# Guest runs in a chroot jail via `jail-run` — only /workspace + RO toolchain.
#
# Isolation profile (mirrored in api/src/lib/sandbox-session.ts):
#   - no network (network_mode: none)
#   - gVisor runsc userspace kernel
#   - drop ALL caps; add only SYS_ADMIN/SYS_CHROOT/SETUID/SETGID/MKNOD for jail setup
#   - read-only rootfs; session dir → /opt/jail/workspace
#   - non-root guest inside chroot (coder uid 1000)
#   - host control plane only via `docker exec` → jail-run
#
#   npm run sandbox:install-gvisor   # once
#   npm run sandbox:up               # build image
#   npm run sandbox:smoke
#   npm run sandbox:shell
#   npm run sandbox:down

name: mockmatch-sandbox

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: mockmatch-sandbox:local
    profiles: ["manual"]
    runtime: ${SANDBOX_RUNTIME:-runsc}
    user: "0:0"
    working_dir: /opt/jail/workspace
    environment:
      HOME: /workspace
      TERM: xterm-256color
      MOCKMATCH_SANDBOX: "1"
    network_mode: "none"
    privileged: false
    read_only: true
    volumes:
      - type: bind
        source: ./workspace
        target: /opt/jail/workspace
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run:size=8m,mode=755,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - MKNOD
    mem_limit: ${SANDBOX_MEM_LIMIT:-512m}
    memswap_limit: ${SANDBOX_MEM_LIMIT:-512m}
    cpus: ${SANDBOX_CPUS:-1.0}
    pids_limit: ${SANDBOX_PIDS_LIMIT:-256}
    ulimits:
      nproc: 256
      nofile:
        soft: 1024
        hard: 1024
      core: 0
