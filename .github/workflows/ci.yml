name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  # Fallow codebase intelligence — PR delta gate + full report on main.
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for --changed-since / PR base detection
          fetch-depth: 0

      # Workspace packages need node_modules so Fallow can resolve
      # @mockmatch/* imports (landpage, packages/*, etc.). Without install,
      # new package files look unused and the new-only gate false-fails.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use local workspace fallow (same as developers). Prefer merge-base vs
      # the PR base action's opaque ISSUES count so failures are inspectable.
      - name: Fallow audit (new issues only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          echo "Auditing changed-since $BASE"
          npx fallow audit --changed-since "$BASE" --gate new-only --format json > fallow-audit.json
          node -e '
            const j = require("./fallow-audit.json");
            console.log(JSON.stringify({
              verdict: j.verdict,
              attribution: j.attribution,
              summary: j.summary,
              introduced_complexity: (j.complexity?.findings || []).filter((f) => f.introduced),
              introduced_unused_files: (j.dead_code?.unused_files || []).filter((f) => f.introduced),
              introduced_unused_deps: (j.dead_code?.unused_dependencies || []).filter((f) => f.introduced),
              introduced_dupes: (j.duplication?.clone_groups || []).filter((g) => g.introduced),
            }, null, 2));
            if (j.verdict === "fail") process.exit(1);
          '

      - name: Fallow full analysis
        if: github.event_name == 'push'
        run: npx fallow audit --gate all --format json > fallow-audit.json || true

  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace=@mockmatch/api

      - name: Typecheck client
        run: npm run typecheck --workspace=client

      - name: Lint client
        run: npm run lint --workspace=client

      # Unit only — no Docker / Testcontainers / Playwright (see npm run test:full locally)
      - name: Unit tests
        run: npm run test:unit

      - name: Build client
        run: npm run build --workspace=client
        env:
          # Build does not need a live API; keep a stable default for any URL reads.
          VITE_API_URL: http://localhost:3000
