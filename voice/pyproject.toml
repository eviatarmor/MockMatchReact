[project]
name = "mockmatch-voice"
version = "0.1.0"
description = "Pipecat voice agent workers for MockMatch conversation simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[webrtc,openrouter,deepgram,openai,silero]>=0.0.90",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.9.0",
]

[project.scripts]
mockmatch-voice = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
